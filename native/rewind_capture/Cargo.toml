[package]
name = "rewind_capture"
version = "0.1.0"
edition = "2021"

[lib]
name = "rewind_api"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_WinRT", "Storage_Streams"] }
windows-capture = "2.0.0-alpha.7"
cpal = "0.17"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
log = "0.4"
env_logger = "0.11"

